<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich 24K Luxury Gold Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7" />
      <stop offset="25%" stop-color="#fcedc5" />
      <stop offset="55%" stop-color="#d6b06a" />
      <stop offset="85%" stop-color="#a37a2e" />
      <stop offset="100%" stop-color="#6e4f16" />
    </linearGradient>

    <linearGradient id="goldSheen" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#9b7734" />
      <stop offset="30%" stop-color="#f3d89e" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#d6b06a" />
      <stop offset="100%" stop-color="#7a5518" />
    </linearGradient>

    <radialGradient id="elixirGlow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#ffd57a" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#c59235" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#6b450e" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#140f08" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15120d" />
      <stop offset="50%" stop-color="#0a0806" />
      <stop offset="100%" stop-color="#050403" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcedc5" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#d6b06a" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#7a5518" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#d6b06a" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for soft royal glow -->
    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Obsidian Rounded Shield -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="112"
    ry="112"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="12"
  />

  <!-- Subtle Inner Inset Border -->
  <rect
    x="34"
    y="34"
    width="444"
    height="444"
    rx="96"
    ry="96"
    fill="none"
    stroke="url(#goldLight)"
    stroke-width="1.5"
    stroke-opacity="0.3"
  />

  <!-- Background Ambient Elixir Bloom -->
  <circle cx="256" cy="300" r="140" fill="url(#elixirGlow)" />

  <!-- Perfume Flacon Cap / Stopper -->
  <!-- Top Finial / Jewel -->
  <path
    d="M256 64 L266 84 L256 94 L246 84 Z"
    fill="url(#goldSheen)"
    filter="url(#royalGlow)"
  />

  <!-- Imperial Crown Dome Cap -->
  <path
    d="M232 98 C232 94, 280 94, 280 98 L292 142 C292 148, 220 148, 220 142 Z"
    fill="url(#goldLight)"
    stroke="#523910"
    stroke-width="1.5"
  />
  <!-- Facet details on cap -->
  <line x1="256" y1="96" x2="256" y2="144" stroke="#fff8e7" stroke-width="2.5" stroke-opacity="0.9" />
  <line x1="240" y1="104" x2="236" y2="142" stroke="#7a5518" stroke-width="1.5" />
  <line x1="272" y1="104" x2="276" y2="142" stroke="#7a5518" stroke-width="1.5" />

  <!-- Stopper Collar Ring -->
  <rect
    x="226"
    y="146"
    width="60"
    height="14"
    rx="4"
    fill="url(#goldSheen)"
    stroke="#3b2707"
    stroke-width="1"
  />

  <!-- Atomizer Neck -->
  <rect
    x="236"
    y="160"
    width="40"
    height="18"
    fill="url(#goldLight)"
  />

  <!-- Main Flacon Body (Imperial Decanter) -->
  <path
    d="M236 178
       L172 208
       C152 218, 142 238, 142 262
       L142 388
       C142 414, 162 432, 188 432
       L324 432
       C350 432, 370 414, 370 388
       L370 262
       C370 238, 360 218, 340 208
       L276 178
       Z"
    fill="none"
    stroke="url(#goldLight)"
    stroke-width="9"
    stroke-linejoin="round"
  />

  <!-- Crystal Base Thickness Line -->
  <path
    d="M156 398 L356 398"
    stroke="url(#goldSheen)"
    stroke-width="4"
    stroke-opacity="0.6"
    stroke-linecap="round"
  />

  <!-- Side Facet Reflections -->
  <path
    d="M164 234 L164 382"
    stroke="url(#goldLight)"
    stroke-width="3"
    stroke-opacity="0.4"
    stroke-linecap="round"
  />
  <path
    d="M348 234 L348 382"
    stroke="url(#goldLight)"
    stroke-width="3"
    stroke-opacity="0.4"
    stroke-linecap="round"
  />

  <!-- Signature Royal 'H' Monogram (Cinzel / Imperial Serif) -->
  <g fill="url(#goldSheen)" filter="url(#royalGlow)">
    <!-- Left Stem -->
    <path
      d="M206 254 L232 254 L232 262 L224 262 L224 340 L232 340 L232 348 L206 348 L206 340 L214 340 L214 262 L206 262 Z"
    />
    <!-- Right Stem -->
    <path
      d="M280 254 L306 254 L306 262 L298 262 L298 340 L306 340 L306 348 L280 348 L280 340 L288 340 L288 262 L280 262 Z"
    />
    <!-- Center Crossbar with Diamond Accent -->
    <path
      d="M214 298 L288 298 L288 306 L214 306 Z"
    />
    <!-- Center Diamond Jewel on Crossbar -->
    <polygon
      points="251,296 256,290 261,296 256,302"
      fill="#ffffff"
    />
  </g>

  <!-- Royal Sparks / Stars -->
  <!-- Left Star -->
  <g transform="translate(104, 136) scale(0.7)">
    <path
      d="M20 0 L24 14 L38 20 L24 26 L20 40 L16 26 L2 20 L16 14 Z"
      fill="url(#goldSheen)"
      opacity="0.85"
    />
  </g>

  <!-- Right Star -->
  <g transform="translate(380, 136) scale(0.7)">
    <path
      d="M20 0 L24 14 L38 20 L24 26 L20 40 L16 26 L2 20 L16 14 Z"
      fill="url(#goldSheen)"
      opacity="0.85"
    />
  </g>

  <!-- Bottom Crown Arc (Heritage Accent) -->
  <path
    d="M216 414 Q256 422 296 414"
    stroke="url(#goldSheen)"
    stroke-width="3"
    fill="none"
    stroke-linecap="round"
  />
</svg>